<ellipse cx="67" cy="74" rx="6" ry="5" fill="#fff"/>
<ellipse cx="93" cy="74" rx="6" ry="5" fill="#fff"/>
<ellipse cx="68" cy="74" rx="3.5" ry="3.5" fill="#2d1a0e"/>
<ellipse cx="94" cy="74" rx="3.5" ry="3.5" fill="#2d1a0e"/>
